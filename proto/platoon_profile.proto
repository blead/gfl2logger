syntax = "proto3";

message PlatoonProfileResponse {
  PlatoonProfile profile = 1;
  uint32 viewer_role_id = 2;
  uint32 member_limit = 5;
}

message PlatoonProfile {
  uint32 uid = 1;
  string name = 2;
  uint32 level = 3;
  uint32 experience = 4;
  uint32 emblem_id = 5;
  string announcement = 6;
  uint32 member_count = 7;
  uint32 field_8 = 8;
  uint32 join_type = 9;
  uint32 language = 10;
  uint32 created_at = 11;
  string recruitment_message = 12;
  uint32 field_13 = 13;
  uint32 field_14 = 14;
  repeated uint32 tags = 15;
  repeated uint32 active_times = 16;
  uint32 region = 17;
}
