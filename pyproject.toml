[project]
name = "gfl2logger"
requires-python = "==3.13.*"
dynamic = ["version"]

dependencies = ["mitmproxy==12.2.3", "protobuf>=5.29.4"]
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["grpcio-tools>=1.71.0"]

[tool.pdm]
distribution = false

[tool.pdm.version]
source = "call"
getter = "gfl2logger.utils.version:get_version"

[tool.pdm.scripts]
pre_protoc.call = "os:makedirs('generated', exist_ok=True)"
# Run through a shell with literal paths. POSIX shells expand the wildcard; cmd.exe
# passes it through and protoc expands it itself on Windows. PDM does not substitute
# ${VAR} in shell scripts, so the paths are written out instead of using env entries.
protoc = { shell = "python -m grpc_tools.protoc --proto_path=proto --python_out=generated --pyi_out=generated proto/*.proto" }
pre_pyinstaller = "pdm run protoc"
pyinstaller = "pyinstaller --clean gfl2logger.spec"

[dependency-groups]
build = ["pillow>=11.2.1", "pyinstaller>=6.13.0"]
